<!-- RUST KINGDOMS DASHBOARD -->
<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" href="/favicon.png">
  <meta charset="UTF-8">
  <title>Rust Event Dashboard</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar">
  <div class="nav-left">
    <a href="/index.html">Home</a>
    <a href="/about.html">About</a>
    <a href="/links.html">Links</a>
    <a href="/dashboard.html" class="active">--Rust Dashboard--</a>
    <a href="/wiki_alpha.html">Wiki</a>
  </div>
  <div class="nav-right">
    <button id="theme-toggle">🌑</button>
  </div>
</nav>

<!-- SEARCH BOX -->
<div class="dashboard-controls">
  <h1>Rust Event Dashboard</h1>
  <input id="searchBox" type="text" placeholder="Search anything..." />
  <button id="resetBtn">Reset</button>
</div>

<!-- SPREADSHEET TABLE HEADER -->
<div class="page-container">
<table id="eventsTable">
    <thead>
        <tr>
            <th>Date</th>
            <th>Category</th>
            <th>Activity</th>
            <th>Streamer</th>
            <th>Location</th>
            <th>Summary</th>
        </tr>
    </thead>
    <tbody id="eventsTableBody"></tbody>
</table>
</div>

<script src="dashboard.js"></script>
</body>

<!-- Theme Toggle: Dark by Default -->
<script>
  const btn = document.getElementById("theme-toggle");
  const root = document.documentElement;

  // Default to dark unless user explicitly selected light.
  const savedTheme = localStorage.getItem("darkMode");
  const darkByDefault = savedTheme !== "0";

  root.classList.toggle("dark", darkByDefault);

  // Switch themes and remember the preference.
  btn.addEventListener("click", () => {
    const dark = root.classList.toggle("dark");
    localStorage.setItem("darkMode", dark ? "1" : "0");
  });
</script>

</html>
