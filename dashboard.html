<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" href="/favicon.png">
  <meta charset="UTF-8">
  <title>Rust Event Dashboard</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>

<nav class="navbar">
  <div class="nav-left">
    <a href="/index.html">Home</a>
    <a href="/about.html">About</a>
    <a href="/links.html">Links</a>
    <a href="/dashboard.html" class="active">Rust Dashboard</a>
  </div>
  <div class="nav-right">
    <button id="theme-toggle">🌑</button>
  </div>
</nav>

<div class="dashboard-controls">
  <h1>Rust Event Dashboard</h1>
  <input id="searchBox" type="text" placeholder="Search anything..." />
  <button id="resetBtn">Reset</button>
</div>

<div class="page-container">
<table id="eventsTable">
    <thead>
        <tr>
            <th>Date</th>
            <th>Category</th>
            <th>Activity</th>
            <th>Streamer</th>
            <th>Location</th>
            <th>Summary</th>
        </tr>
    </thead>
    <tbody id="eventsTableBody"></tbody>
</table>
</div>

<script src="dashboard.js"></script>
</body>

<!-- Dark Mode Script -->
<script>
  const btn = document.getElementById("theme-toggle");
  const root = document.documentElement;
  btn.addEventListener("click", () => {
    const dark = root.classList.toggle("dark");
    localStorage.setItem("darkMode", dark ? "1" : "0");
  });
  if (localStorage.getItem("darkMode") === "1") root.classList.add("dark");
</script>

</html>
